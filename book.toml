# deer-gui 中文文档站点（mdBook）—— 独立文档仓库，工程根即仓库根。
# 本地预览：
#   mdbook build
#   mdbook serve
[book]
title = "deer-gui 中文文档"
authors = ["DeerLuuu"]
description = "deer-gui —— 从零实现的 Rust GUI 运行时：节点树、布局代数、CPU/GPU 渲染、输入交互的中文教程与 API 参考"
src = "src"
language = "zh-CN"

[build]
build-dir = "book"
# SUMMARY.md 里链接到的文件必须真实存在：宁可构建红，也不要站点上出现 404 章节。
create-missing = false

[output.html]
# GitHub Pages 项目站点路径：https://deerluuu.github.io/deer-gui-docs/
# ⚠️ 仓库改名 / 迁移到别的仓库名时，这里必须同步改，否则 404 页与搜索索引的资源路径会错。
site-url = "/deer-gui-docs/"
default-theme = "light"
preferred-dark-theme = "navy"
smart-punctuation = true
# 右上角 GitHub 图标指向主代码仓库（读者最终要找的是代码）。
git-repository-url = "https://github.com/DeerLuuu/deer-gui"
git-repository-icon = "fa-github"
# 「建议编辑」链接指向本文档仓库的源文件（src/ 在仓库根，故无 docs/ 前缀）。
edit-url-template = "https://github.com/DeerLuuu/deer-gui-docs/edit/main/{path}"

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 2
boost-paragraph = 1
expand = true
heading-split-level = 2

[output.html.fold]
# 左侧多级侧边栏可折叠（Godot 文档风格）。
enable = true
depth = 2
